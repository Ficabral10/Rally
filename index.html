<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rally</title>
<style>
:root{--nav:58px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--ink:#f4f6f5;--mut:#a3aaa8;--line:rgba(255,255,255,.12);--acc:#ff6b45;--ok:#4cd38f;--bad:#ff7a6e;--card:#141617;--bg:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.view{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav) + var(--sb));overflow:hidden}
.view[hidden]{display:none}
/* header */
#hdr{position:fixed;z-index:20;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 14px 22px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
#hdr>*{pointer-events:auto}
#brand{font-weight:800;letter-spacing:-.02em;font-size:19px;display:flex;align-items:center;gap:6px;min-height:44px}
#streak{display:inline-flex;align-items:center;gap:3px;font-size:15px;font-weight:700;color:var(--mut)}
#streak.hit{color:#ffb547}
#prog{margin-left:auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:13px;font-weight:600;color:#e7ecea}
#prog .ring{width:26px;height:26px}
#hdr.solid{background:#000;padding-bottom:8px;border-bottom:1px solid var(--line)}
/* nav */
#nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);display:flex;background:#000;border-top:1px solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#8d9492;min-height:44px}
#nav button[aria-current=page]{color:#fff}
#nav svg{width:24px;height:24px}
#nav .dot{position:absolute;margin:-18px 0 0 20px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.slide video,.slide .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.slide .poster{background-size:cover;background-position:center}
.slide .shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));pointer-events:none}
.cap{position:absolute;left:14px;right:78px;top:63%;text-align:center;font-size:21px;font-weight:700;line-height:1.25;pointer-events:none}
.cap span{background:rgba(0,0,0,.66);padding:3px 9px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cap:empty{display:none}
.nocc .cap{display:none}
.meta{position:absolute;left:14px;right:84px;bottom:18px}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ffcf9a;display:flex;gap:8px;align-items:center}
.kick .lang{border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:0 5px;color:#fff;font-size:11px;letter-spacing:.03em}
.meta h2{margin:6px 0 10px;font-size:18px;line-height:1.25;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.follow{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700;font-size:15px}
.follow svg{width:18px;height:18px}
.rail{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.rail svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rail .on svg{fill:#ffb547;stroke:#ffb547}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:#fff}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
.center svg{width:36px;height:36px}
.slide.paused .center.play,.slide.ended .center.replay{display:flex}
.slide.ended .center.replay{pointer-events:auto}
.slide.ended .cap{display:none}
.unmute{position:absolute;right:12px;top:calc(var(--st) + 62px);display:none;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;background:rgba(0,0,0,.55);font-size:13px;font-weight:600}
.muted .slide.active:not(.chipgone) .unmute{display:flex}
.donechip{display:none;margin-left:6px;color:var(--ok)}
.slide.counted .donechip{display:inline}
.broken .errbox{display:flex}
.errbox{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#111;text-align:center;padding:30px}
.errbox p{margin:0;color:var(--mut)}
.btn{min-height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#000;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.spoil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;padding:30px}
.hidespoil .spoil{display:flex}
.spoil h3{margin:0;font-size:22px}
.endcard{display:flex;flex-direction:column;justify-content:center;padding:30px 24px;gap:14px;background:radial-gradient(circle at 70% 20%,#2a1610,#000 70%)}
.endcard h2{font-size:30px;margin:0;letter-spacing:-.02em}
.endcard p{margin:0;color:var(--mut)}
.endcard .row{display:flex;gap:10px;flex-wrap:wrap}
/* pull to refresh */
#ptr{position:absolute;z-index:15;left:50%;top:calc(var(--st) + 62px);transform:translate(-50%,-30px);opacity:0;background:#fff;color:#000;font-size:13px;font-weight:700;padding:8px 14px;border-radius:18px;transition:transform .2s;pointer-events:none;white-space:nowrap}
#ptr.show{transform:translate(-50%,0);opacity:1}
#pill{position:absolute;z-index:16;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);display:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--acc);color:#000;font-weight:800;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#pill.show{display:inline-flex;align-items:center}
#toast{position:fixed;z-index:60;left:50%;top:calc(var(--st) + 60px);transform:translate(-50%,-12px);opacity:0;background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* pages */
.page{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--st) + 64px) 16px 30px;-webkit-overflow-scrolling:touch}
.page h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 10px;padding-left:16px;scrollbar-width:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);font-size:14px;font-weight:600;color:#cfd5d3}
.chips button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.story{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.story .top{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge{border-radius:5px;padding:1px 6px;font-size:11px;background:rgba(255,255,255,.1);color:#fff}
.badge.developing{background:#5a3b05;color:#ffcf6a}
.story h3{margin:6px 0 4px;font-size:18px;line-height:1.25}
.story p{margin:0;color:#c5cbc9;font-size:15px}
.story .read{color:var(--ok);font-size:12px}
.tiles{display:grid;gap:12px}
.tile{display:block;text-align:left;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%}
.tile b{font-size:19px;display:block}
.tile span{color:var(--mut);font-size:14px}
.tile .tag{float:right;color:#ffcf9a;font-size:13px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0 12px}
.seg button{min-height:38px;padding:0 14px;font-size:14px;font-weight:600;color:#cfd5d3}
.seg button[aria-pressed=true]{background:#fff;color:#000}
.sec{margin:22px 0 8px;font-size:13px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{aspect-ratio:9/16;border-radius:8px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.grid button span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:11px;font-weight:700;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.empty{color:var(--mut);padding:20px 0}
/* sheet */
#sheetbg{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:90%;height:90%;background:#121414;border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sb)}
body.sheet #sheet{transform:none}
body.sheet #sheetbg{opacity:1;pointer-events:auto}
#sheet .grab{display:flex;align-items:center;gap:8px;padding:6px 8px 4px 16px;border-bottom:1px solid var(--line);min-height:52px}
#sheet .grab b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .x{min-width:44px;min-height:44px;font-size:15px;font-weight:700;color:#fff;padding:0 10px;border-radius:22px;background:rgba(255,255,255,.1)}
#sheetbody{overflow-y:auto;padding:16px 18px 30px;flex:1;-webkit-overflow-scrolling:touch}
#sheetbody h2{font-size:24px;line-height:1.2;margin:4px 0 8px;letter-spacing:-.01em}
#sheetbody h4{margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#ffcf9a}
#sheetbody p{margin:0 0 8px;color:#dfe4e2;font-size:16px;line-height:1.5}
.src{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#9ec3ff;font-weight:600;text-decoration:none}
.vis{margin:14px 0;padding:14px;border-radius:14px;background:#1b1e1f}
.vis .cmp{display:flex;gap:16px;align-items:flex-end}
.vis .big{font-size:38px;font-weight:800;letter-spacing:-.02em}
.vis .old{color:#8d9492;text-decoration:line-through}
.vis .tl{display:flex;flex-direction:column;gap:8px}
.vis .tl div{display:flex;gap:12px}.vis .tl b{min-width:72px;color:#ffcf9a}
.vis small{color:var(--mut);display:block}
/* drills */
.q{font-size:19px;font-weight:700;margin:6px 0 10px;line-height:1.3}
pre{background:#0b0d0d;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font:14px/1.45 ui-monospace,Menlo,monospace;color:#e8f0ec}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{min-height:50px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#181b1b;font-size:16px}
.opt.right{border-color:var(--ok);background:#0f2a1c}
.opt.wrong{border-color:var(--bad);background:#2c1412}
.opt:disabled{cursor:default;opacity:1}
.fb{border-radius:12px;padding:12px 14px;background:#181b1b;margin:8px 0}
.fb b{display:block;margin-bottom:4px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.fb .trap{color:#ffcf9a}
details{margin-top:8px}summary{min-height:40px;display:flex;align-items:center;color:#9ec3ff;font-weight:600;cursor:pointer}
textarea{width:100%;min-height:160px;background:#0b0d0d;color:#e8f0ec;border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.45 ui-monospace,Menlo,monospace}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.toggle i{width:44px;height:26px;border-radius:13px;background:#333;position:relative;flex:none}
.toggle i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle[aria-checked=true] i{background:var(--ok)}.toggle[aria-checked=true] i:after{left:21px}
.week{display:flex;gap:6px;margin:10px 0}
.week div{flex:1;text-align:center;font-size:11px;padding:8px 0;border-radius:10px;background:#1b1e1f;color:var(--mut)}
.week .on{background:#3a2a0c;color:#ffcf6a}.week .today{outline:1px solid #fff}
.fine{color:var(--mut);font-size:13px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.slide.yt{background:radial-gradient(circle at 50% 30%,#14301f,#000 75%)}
.ytwrap{position:absolute;left:0;right:0;top:calc(var(--st) + 64px);display:flex;flex-direction:column;gap:8px}
.ythead{padding:0 14px}.ythead .comp{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9fe0b4}.ythead .teams{font-size:20px;font-weight:800;margin-top:2px}
.ytframe{position:relative;width:100%;aspect-ratio:16/9;background:#000}.ytframe iframe,.ytframe>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytsrc{padding:0 14px;font-size:12px;color:#a3aaa8}.ythint{display:none;color:#ffcf6a;font-weight:700}.needtap .ythint{display:inline}
.moments{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}.moments button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);font-size:14px;font-weight:700;color:#e8efec}.moments button[aria-selected=true]{background:#fff;color:#000;border-color:#fff}
.slide.yt .cap{position:static;transform:none;margin:4px 14px 0;text-align:left;font-size:19px}
.slide.yt .center{display:none!important}.slide.yt.ended .center.replay{display:flex!important;top:auto;bottom:200px}
.slide.yt .shade{height:38%}
@media (min-width:600px){.view,#hdr{max-width:480px;margin:0 auto}#nav{max-width:480px;margin:0 auto}#sheet{max-width:480px;margin:0 auto}}
</style>
</head>
<body class="muted">
<header id="hdr">
  <button id="brand" aria-label="Rally status">Rally <span id="streak" aria-label="streak">🔥<span id="sn">0</span></span></button>
  <button id="prog" aria-label="Today's progress"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/><circle id="ringv" cx="18" cy="18" r="15" fill="none" stroke="#ffb547" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg><span id="pt">0/10</span></button>
</header>
<main>
  <section class="view" id="v-foryou" aria-label="For You">
    <div id="ptr" aria-live="polite">Pull to refresh</div>
    <button id="pill" aria-live="polite"></button>
    <div id="feed"></div>
  </section>
  <section class="view" id="v-news" hidden aria-label="News"><div class="page" id="newspage"></div></section>
  <section class="view" id="v-practice" hidden aria-label="Practice"><div class="page" id="practicepage"></div></section>
  <section class="view" id="v-saved" hidden aria-label="Saved"><div class="page" id="savedpage"></div></section>
</main>
<nav id="nav" aria-label="Main">
  <button data-v="foryou" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>For You</button>
  <button data-v="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>News</button>
  <button data-v="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Practice</button>
  <button data-v="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
</nav>
<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle"><div class="grab"><b id="sheettitle"></b><button class="x" id="sheetx">Close</button></div><div id="sheetbody"></div></div>
<div id="toast" role="status"></div>
<script>
"use strict";
const BUILD = "gh-1.3.0";
const NEED = 10, DRILL_NEED = 3;
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- Pacific dates ---------- */
